name: Daily public job discovery

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai; GitHub scheduling can be delayed.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-job-search.yml'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: daily-job-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ vars.JOB_SEARCH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate implementation
        run: python -m unittest discover -s tests -v
      - name: Load optional private settings or public generic fallback
        env:
          JOB_SEARCH_CONFIG_JSON: ${{ secrets.JOB_SEARCH_CONFIG_JSON }}
        shell: bash
        run: python scripts/prepare_discovery_config.py --fallback config/job-search.example.json --output "$RUNNER_TEMP/job-search.runtime.json"
      - name: Restore previously seen posting identifiers
        uses: actions/cache@v4
        with:
          path: .job-search-state
          key: job-search-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-search-state-${{ github.ref_name }}-
      - name: Discover current public postings
        run: python scripts/job_search.py --config "$RUNNER_TEMP/job-search.runtime.json" --output output --state .job-search-state/seen.json
      - name: Attach reports, including source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-job-discovery-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary search configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/job-search.runtime.json"
